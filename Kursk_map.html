<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Курська та Белгородська області — Тривоги</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background: #1a1a1a; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100%; background: #2b2b2b; }

        #datetime {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            border: 1px solid #444;
        }

        #editor-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: #ffffff;
            color: #000;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #ccc;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #editor-btn:hover { background: #f0f0f0; }

        #password-box {
            position: absolute;
            top: 55px;
            right: 10px;
            z-index: 1001;
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #ffcc00;
            display: none;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            width: 220px;
        }
        #password-box input {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #666;
            background: #222;
            color: #fff;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 8px;
        }
        #password-box button {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: none;
            background: #ffcc00;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
        #password-box button:hover { background: #e6b800; }
        #password-error {
            color: #ff4444;
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }

        .district-label {
            color: #fff; font-size: 11px; font-weight: bold;
            text-shadow: 1px 1px 2px #000; white-space: nowrap;
            pointer-events: none;
        }
        .region-label {
            color: #ffcc00; font-size: 14px; font-weight: bold;
            text-shadow: 1px 1px 3px #000; white-space: nowrap;
            pointer-events: none;
        }

        .explosion {
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,200,0,0.9) 0%, rgba(255,80,0,0.7) 40%, rgba(255,0,0,0) 70%);
            animation: explode 1.2s ease-out forwards;
            pointer-events: none;
        }
        @keyframes explode {
            0% { transform: scale(0.2); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }
    </style>
</head>
<body>

<div id="datetime">Завантаження...</div>
<div id="editor-btn">🔒 Редактор</div>

<div id="password-box">
    <input type="password" id="password-input" placeholder="Введіть пароль..." />
    <button onclick="checkPassword()">Увійти</button>
    <div id="password-error">Невірний пароль!</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // --- ПАРОЛЬ ---
    var EDITOR_PASSWORD = "admin2026";
    var isEditor = false;

    document.getElementById('editor-btn').addEventListener('click', function() {
        var box = document.getElementById('password-box');
        box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    });
function checkPassword() {
        var input = document.getElementById('password-input').value;
        if (input === EDITOR_PASSWORD) {
            isEditor = true;
            document.getElementById('password-box').style.display = 'none';
            document.getElementById('editor-btn').textContent = '✏️ Редактор (активний)';
            document.getElementById('editor-btn').style.background = '#ffcc00';
            enableEditing();
        } else {
            document.getElementById('password-error').style.display = 'block';
        }
    }

    // --- Дата й час ---
    function updateDateTime() {
        var now = new Date();
        var options = { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
        document.getElementById('datetime').textContent = '📅 ' + now.toLocaleString('uk-UA', options);
    }
    updateDateTime();
    setInterval(updateDateTime, 1000);

    // --- Карта ---
    var map = L.map('map', {
        zoomControl: false,
        attributionControl: false
    }).setView([51.3, 36.0], 7);

    // Тайли
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19
    }).addTo(map);

    // --- Дані ---
    var regions = {
        "Курська область": [[52.3,35.0],[52.4,35.4],[52.3,35.9],[52.0,36.3],[51.8,36.9],[51.5,37.1],[51.2,36.8],[51.0,36.2],[51.1,35.6],[51.2,35.1],[51.5,34.6],[51.9,34.5],[52.2,34.7]],
        "Белгородська область": [[51.1,36.2],[51.2,36.8],[51.0,37.5],[50.7,38.2],[50.4,38.5],[50.1,38.0],[50.0,37.3],[50.2,36.6],[50.4,36.0],[50.6,35.5],[50.9,35.8]]
    };

    var districts = {
        "Курський": [[51.7,36.1],[51.85,36.2],[51.7,36.35],[51.55,36.2]],
        "Курчатовський": [[51.55,35.55],[51.7,35.65],[51.55,35.8],[51.45,35.65]],
        "Льговський": [[51.55,35.15],[51.7,35.25],[51.55,35.4],[51.45,35.25]],
        "Суджанський": [[51.15,35.15],[51.3,35.25],[51.15,35.4],[51.05,35.25]],
        "Рильський": [[51.45,34.55],[51.6,34.65],[51.45,34.8],[51.35,34.65]],
        "Обоянський": [[51.15,35.95],[51.3,36.05],[51.15,36.2],[51.05,36.05]],
        "Желєзногорський": [[52.25,35.25],[52.4,35.35],[52.25,35.5],[52.15,35.35]],
        "Дмитрієвський": [[52.05,34.95],[52.2,35.05],[52.05,35.2],[51.95,35.05]],
        "Фатезький": [[52.0,35.8],[52.15,35.9],[52.0,36.0],[51.9,35.9]],
        "Щигровський": [[51.8,36.8],[51.95,36.9],[51.8,37.05],[51.7,36.9]],
        "Белгородський": [[50.5,36.4],[50.7,36.5],[50.5,36.7],[50.4,36.5]],
        "Шебекінський": [[50.3,36.7],[50.5,36.8],[50.3,37.0],[50.2,36.8]],
        "Валуйський": [[50.1,37.8],[50.3,37.9],[50.1,38.1],[50.0,37.9]],
        "Старооскольський": [[51.2,37.7],[51.4,37.8],[51.2,38.0],[51.1,37.8]],
        "Губкінський": [[51.1,37.3],[51.3,37.4],[51.1,37.6],[51.0,37.4]]
    };

    var towns = [
        { name: "Курськ", coords: [51.73, 36.19] },
        { name: "Курчатов", coords: [51.66, 35.65] },
        { name: "Льгов", coords: [51.60, 35.27] },
        { name: "Суджа", coords: [51.20, 35.27] },
        { name: "Рильськ", coords: [51.57, 34.68] },
        { name: "Обоянь", coords: [51.21, 36.10] },
        { name: "Белгород", coords: [50.60, 36.59] },
        { name: "Шебекіно", coords: [50.40, 36.90] },
        { name: "Валуйки", coords: [50.21, 38.10] },
        { name: "Старий Оскол", coords: [51.30, 37.85] },
        { name: "Губкін", coords: [51.28, 37.55] }
    ];

    // --- Шари (зберігаємо) ---
    var regionLayers = [];
    var districtLayers = [];
    var townLayers = [];

    // --- Додаємо області ---
    for (var r in regions) {
        var poly = L.polygon(regions[r], {
            color: '#ffffff', weight: 2, fill: false, dashArray: '5,5', interactive: false
        }).addTo(map);
var rc = poly.getBounds().getCenter();
        var lbl = L.marker(rc, {
            icon: L.divIcon({className:'region-label', html:r, iconSize:[150,20], iconAnchor:[75,10]}),
            interactive: false
        }).addTo(map);
        regionLayers.push({ poly: poly, label: lbl, name: r });
    }

    // --- Додаємо райони ---
    for (var d in districts) {
        var poly = L.polygon(districts[d], {
            color: '#ffffff', weight: 1.5, fillColor: '#d4a017', fillOpacity: 0.85, interactive: false
        }).addTo(map);
        var c = poly.getBounds().getCenter();
        var lbl = L.marker(c, {
            icon: L.divIcon({className:'district-label', html:d, iconSize:[100,20], iconAnchor:[50,10]}),
            interactive: false
        }).addTo(map);
        districtLayers.push({ poly: poly, label: lbl, name: d, coords: districts[d] });
    }

    // --- Додаємо населені пункти ---
    towns.forEach(function(town) {
        var marker = L.marker(town.coords, { interactive: false }).addTo(map);
        marker.bindPopup("<b>" + town.name + "</b>");
        townLayers.push({ marker: marker, town: town });
    });

    // --- Вибух ---
    function createExplosion(coords) {
        var explosion = L.circle(coords, {
            radius: 8000, className: 'explosion', stroke: false, fill: true, fillColor: 'red', fillOpacity: 0.9
        }).addTo(map);
        setTimeout(function() { map.removeLayer(explosion); }, 1200);
    }

    // --- Активація редагування ---
    function enableEditing() {
        // Видаляємо старі шари
        districtLayers.forEach(function(item) {
            map.removeLayer(item.poly);
            map.removeLayer(item.label);
        });
        townLayers.forEach(function(item) {
            map.removeLayer(item.marker);
        });

        // Створюємо нові з interactive: true
        districtLayers = [];
        for (var d in districts) {
            var poly = L.polygon(districts[d], {
                color: '#ffffff', weight: 1.5, fillColor: '#d4a017', fillOpacity: 0.85, interactive: true
            }).addTo(map);
            var c = poly.getBounds().getCenter();
            var lbl = L.marker(c, {
                icon: L.divIcon({className:'district-label', html:d, iconSize:[100,20], iconAnchor:[50,10]}),
                interactive: false
            }).addTo(map);

            (function(name, polygon, label) {
                polygon.on('click', function() {
                    if (polygon.options.fillColor === '#d4a017') {
                        polygon.setStyle({fillColor: '#1a1a1a'});
                        label.getElement().style.color = '#ff4444';
                    } else {
                        polygon.setStyle({fillColor: '#d4a017'});
                        label.getElement().style.color = '#fff';
                    }
                });
            })(d, poly, lbl);

            districtLayers.push({ poly: poly, label: lbl, name: d });
        }

        townLayers = [];
        towns.forEach(function(town) {
            var marker = L.marker(town.coords, { interactive: true }).addTo(map);
            marker.bindPopup("<b>" + town.name + "</b>");
            marker.on('click', function() {
                createExplosion(town.coords);
            });
            townLayers.push({ marker: marker, town: town });
        });
    }

    // --- Легенда ---
    var legend = L.control({position: 'bottomright'});
    legend.onAdd = function() {
        var div = L.DomUtil.create('div', 'info legend');
        div.style.background = 'rgba(0,0,0,0.8)';
        div.style.color = '#fff';
        div.style.padding = '8px 12px';
        div.style.borderRadius = '6px';
        div.style.fontSize = '13px';
        div.innerHTML =
            '<div><span style="display:inline-block;width:14px;height:14px;background:#d4a017;margin-right:6px;"></span> Спокійно</div>' +
'<div><span style="display:inline-block;width:14px;height:14px;background:#1a1a1a;border:1px solid #fff;margin-right:6px;"></span> Тривога</div>' +
            '<div><span style="display:inline-block;width:14px;height:14px;background:red;border-radius:50%;margin-right:6px;"></span> Вибух (тільки редактор)</div>';
        return div;
    };
    legend.addTo(map);
</script>

</body>
</html>
